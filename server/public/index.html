<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yooma</title>
<meta name="description" content="Yooma — мессенджер">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="data:application/json,{}">
<style>
:root{--bg:#0d0d14;--bg2:#12121c;--card:#151524;--card2:#1a1a30;--border:#2a2a3a;--border2:#3b3b50;--title:#e8ecf4;--body:#b0b4cc;--body50:#7a7ea0;--muted:#54587a;--accent:#3d7bff;--accent2:#5b8def;--red:#ef4444;--green:#22c55e;--radius:12px;--header-h:56px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;overflow:hidden}
input,button,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ─── Auth ─── */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 30% 20%,rgba(61,123,255,.08),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(91,141,239,.06),transparent 60%),var(--bg)}
.auth-card{width:400px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-card .logo{font-size:36px;font-weight:900;text-align:center;margin-bottom:4px}
.auth-card .logo .y{color:var(--accent)}
.auth-card .logo .oo{color:var(--accent2)}
.auth-card .logo .ma{color:var(--title)}
.auth-card .sub{text-align:center;color:var(--body50);font-size:13px;margin-bottom:20px}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;justify-content:center}
.auth-tab{padding:8px 22px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--body50);cursor:pointer;transition:.15s}
.auth-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--body);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:8px;padding:11px 14px;font-size:14px;transition:border-color .2s}
.fld input:focus{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:800;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{filter:brightness(1.08)}
.btn-full{width:100%}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--body);font-weight:600}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:linear-gradient(135deg,var(--red),#dc2626);color:#fff}

/* ─── App Layout ─── */
.app{display:none;height:100vh;display:grid;grid-template-columns:340px 1fr}
@media(max-width:768px){.app{grid-template-columns:1fr}}
.sidebar{background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.sb-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-hdr .logo{font-size:20px;font-weight:900}
.sb-hdr .logo .y{color:var(--accent)}.sb-hdr .logo .oo{color:var(--accent2)}.sb-hdr .logo .ma{color:var(--title)}
.sb-hdr .acts{display:flex;gap:4px}
.sb-hdr .acts button{background:none;border:none;color:var(--body50);font-size:18px;cursor:pointer;padding:4px 6px;border-radius:6px;transition:.15s}
.sb-hdr .acts button:hover{color:var(--title);background:var(--card)}
.sb-user{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:13px}
.sb-user .ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:0 0 36px;overflow:hidden;background-size:cover;background-position:center}
.sb-user .info{flex:1;min-width:0}
.sb-user .info .name{font-weight:700;color:var(--title);font-size:14px}
.sb-user .info .st{font-size:11px;color:var(--body50)}
.sb-search{padding:8px 12px;border-bottom:1px solid var(--border)}
.sb-search input{width:100%;background:var(--card);border:1px solid var(--border2);color:var(--title);border-radius:8px;padding:8px 12px;font-size:13px}
.sb-search input:focus{border-color:var(--accent)}
.chat-list{flex:1;overflow-y:auto;padding:4px 8px}
.chat-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
.chat-item:hover,.chat-item.active{background:var(--card)}
.chat-item .ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 42px;overflow:hidden;background-size:cover;background-position:center}
.chat-item .info{flex:1;min-width:0}
.chat-item .info .name{font-size:14px;font-weight:700;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .info .last{font-size:12px;color:var(--body50);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-item .info .online{color:var(--green);font-size:10px;font-weight:700}
.chat-item .time{font-size:10px;color:var(--muted);white-space:nowrap}

/* ─── Chat ─── */
.main{display:flex;flex-direction:column;background:var(--bg)}
.chat-hdr{display:none;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;gap:10px;background:var(--bg2)}
.chat-hdr .back{display:none;background:none;border:none;color:var(--body50);font-size:20px;cursor:pointer}
@media(max-width:768px){.chat-hdr .back{display:block}}
.chat-hdr .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 38px;overflow:hidden;background-size:cover}
.chat-hdr .info{flex:1}
.chat-hdr .info .name{font-size:15px;font-weight:700;color:var(--title)}
.chat-hdr .info .st{font-size:11px;color:var(--body50)}
.chat-hdr .acts{display:flex;gap:4px}
.chat-hdr .acts button{background:none;border:none;color:var(--body50);font-size:16px;cursor:pointer;padding:4px}
.msg-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;word-wrap:break-word;position:relative}
.msg.own{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.other{background:var(--card);border:1px solid var(--border);color:var(--body);align-self:flex-start;border-bottom-left-radius:4px}
.msg .sender{font-size:11px;font-weight:700;color:var(--accent2);margin-bottom:2px}
.msg .time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.msg .file-link{display:block;color:var(--accent);text-decoration:underline;font-size:13px;margin-top:4px}
.msg img{max-width:100%;border-radius:8px;margin-top:4px;max-height:200px}
.msg .del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;cursor:pointer;border:none}
.msg.own:hover .del{display:flex}
.typing{font-size:12px;color:var(--body50);padding:2px 16px 0;font-style:italic;min-height:18px}
.input-area{display:none;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg2)}
.input-area input{flex:1;background:var(--card);border:1px solid var(--border2);color:var(--title);border-radius:8px;padding:10px 12px;font-size:14px}
.input-area input:focus{border-color:var(--accent)}
.input-area button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:16px;cursor:pointer}
.input-area .clip{background:none;border:none;color:var(--body50);font-size:18px;cursor:pointer;padding:0 4px}

/* ─── Welcome ─── */
.welcome{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:12px;color:var(--muted)}
.welcome .logo{font-size:48px;font-weight:900}
.welcome .logo .y{color:var(--accent)}.welcome .logo .oo{color:var(--accent2)}.welcome .logo .ma{color:var(--body50)}
.welcome p{font-size:14px;color:var(--body50)}
.welcome .btn{margin-top:8px}

/* ─── Modal ─── */
.modal-ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-ov.open{display:flex}
.modal{width:480px;max-width:100%;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px}
.modal h3{font-size:18px;font-weight:900;color:var(--title);margin-bottom:12px}
.modal .close{float:right;background:none;border:none;color:var(--body50);font-size:20px;cursor:pointer}
.modal .close:hover{color:var(--red)}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .15s}
.user-row:hover{background:var(--card)}
.user-row .ava{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 36px;overflow:hidden;background-size:cover}
.user-row .name{font-size:14px;font-weight:700;color:var(--title)}
#userList{max-height:300px;overflow-y:auto}
#emojiPicker{display:none;position:absolute;bottom:60px;left:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;width:320px;max-height:200px;overflow-y:auto;z-index:10;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#emojiPicker .emoji-btn{font-size:24px;background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;transition:background .15s}
#emojiPicker .emoji-btn:hover{background:var(--card2)}
</style>
</head>
<body>

<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="logo"><span class="y">Y</span><span class="oo">oo</span><span class="ma">ma</span></div>
    <div class="sub">Общайся с друзьями</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuth('login')">Вход</button>
      <button class="auth-tab" onclick="switchAuth('register')">Создать</button>
    </div>
    <div id="authLogin">
      <div class="fld"><label>Твой ник</label><input id="loginId" placeholder="Введи ник" maxlength="20"></div>
      <button class="btn btn-full" onclick="login()">Войти</button>
      <div id="loginMsg" style="margin-top:8px;font-size:13px;text-align:center;color:var(--red)"></div>
    </div>
    <div id="authRegister" style="display:none">
      <div class="fld"><label>Придумай ник</label><input id="regLogin" maxlength="20" placeholder="Твой уникальный ник"></div>
      <button class="btn btn-full" onclick="register()">Создать аккаунт</button>
      <div id="regMsg" style="margin-top:8px;font-size:13px;text-align:center;color:var(--red)"></div>
    </div>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="sb-hdr">
      <div class="logo"><span class="y">Y</span><span class="oo">oo</span><span class="ma">ma</span></div>
      <div class="acts">
        <button onclick="showNewChat()" title="Новый чат">✏️</button>
        <button onclick="showProfile()" title="Профиль">⚙️</button>
      </div>
    </div>
    <div class="sb-user" id="sbUser">
      <div class="ava" id="myAva"></div>
      <div class="info"><div class="name" id="myName"></div><div class="st" id="myStatus">Онлайн</div></div>
    </div>
    <div class="sb-search"><input id="chatSearch" placeholder="Поиск чатов…" oninput="renderChats()"></div>
    <div class="chat-list" id="chatList"></div>
  </div>
  <div class="main">
    <div class="chat-hdr" id="chatHdr">
      <button class="back" onclick="closeChat()">←</button>
      <div class="ava" id="chatAva"></div>
      <div class="info"><div class="name" id="chatName"></div><div class="st" id="chatStatus"></div></div>
      <div class="acts">
        <button onclick="showChatInfo()" title="Инфо">ℹ️</button>
      </div>
    </div>
    <div class="msg-area" id="msgArea"></div>
    <div class="typing" id="typingIndicator"></div>
    <div class="input-area" id="inputArea">
      <button class="clip" onclick="toggleEmoji()">😊</button>
      <div id="emojiPicker"></div>
      <input id="msgInput" placeholder="Сообщение…" onkeydown="if(event.key==='Enter')sendMsg()" oninput="onTyping()">
      <button onclick="sendMsg()">➤</button>
    </div>
    <div class="welcome" id="welcome">
      <div class="logo"><span class="y">Y</span><span class="oo">oo</span><span class="ma">ma</span></div>
      <p>Выберите чат или создайте новый</p>
      <button class="btn" onclick="showNewChat()">✏️ Новый чат</button>
    </div>
  </div>
</div>

<!-- New Chat Modal -->
<div class="modal-ov" id="newChatModal">
  <div class="modal">
    <button class="close" onclick="closeModal('newChatModal')">✕</button>
    <h3>Новый чат</h3>
    <div class="fld"><label>Название комнаты</label><input id="roomName" placeholder="Например: Друзья" maxlength="30"></div>
    <button class="btn btn-full" onclick="createRoom()">Создать комнату</button>
    <div style="margin:12px 0;text-align:center;color:var(--body50)">— или присоединиться —</div>
    <div class="fld"><label>Код комнаты</label><input id="roomCode" placeholder="Введи код комнаты"></div>
    <button class="btn btn-full btn-ghost" onclick="joinRoom()">Присоединиться</button>
    <div id="roomMsg" style="margin-top:8px;font-size:13px;text-align:center"></div>
  </div>
</div>

<!-- Profile Modal -->
<div class="modal-ov" id="profileModal">
  <div class="modal">
    <button class="close" onclick="closeModal('profileModal')">✕</button>
    <h3>Профиль</h3>
    <div style="text-align:center;margin:16px 0">
      <div style="width:80px;height:80px;border-radius:50%;margin:0 auto;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;background-size:cover;background-position:center" id="profileAva"></div>
    </div>
    <div class="fld"><label>Ник</label><input id="profileName" maxlength="20"></div>
    <div class="fld"><label>Аватар (URL)</label><input id="profileAvatar" placeholder="https://example.com/avatar.png"></div>
    <div class="fld"><label>О себе</label><input id="profileBio" placeholder="Напиши что-то о себе" maxlength="100"></div>
    <button class="btn btn-full" onclick="saveProfile()">Сохранить</button>
    <button class="btn btn-full btn-ghost" style="margin-top:8px" onclick="logout()">Выйти</button>
  </div>
</div>

<script>
// ═══════════════ DATA ═══════════════
let curUser = null;
let rooms = [];
let currentRoom = null;
let allMessages = {};
let typingTimers = {};

function $id(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// ─── Auth ───
function switchAuth(t){
  document.querySelectorAll('.auth-tab').forEach(b=>b.classList.toggle('active',b.textContent.includes(t==='login'?'Вход':'Создать')));
  $id('authLogin').style.display=t==='login'?'block':'none';
  $id('authRegister').style.display=t==='register'?'block':'none';
}

function register(){
  const l=$id('regLogin').value.trim();
  if(!l||l.length<3){$id('regMsg').textContent='Ник минимум 3 символа';return}
  const users=JSON.parse(localStorage.getItem('yooma_users')||'[]');
  if(users.find(u=>u.login===l)){$id('regMsg').textContent='Ник уже занят';return}
  users.push({login:l,avatar:'',bio:'',rooms:[]});
  localStorage.setItem('yooma_users',JSON.stringify(users));
  curUser={login:l,avatar:'',bio:''};
  localStorage.setItem('yooma_user',JSON.stringify(curUser));
  enterApp();
}

function login(){
  const l=$id('loginId').value.trim();
  if(!l){$id('loginMsg').textContent='Введи ник';return}
  const users=JSON.parse(localStorage.getItem('yooma_users')||'[]');
  const u=users.find(x=>x.login===l);
  if(!u){$id('loginMsg').textContent='Пользователь не найден. Создай аккаунт.';return}
  curUser={login:u.login,avatar:u.avatar||'',bio:u.bio||''};
  localStorage.setItem('yooma_user',JSON.stringify(curUser));
  enterApp();
}

function logout(){
  curUser=null;
  localStorage.removeItem('yooma_user');
  $id('app').style.display='none';
  $id('authScreen').style.display='flex';
}

// ─── App ───
function enterApp(){
  $id('authScreen').style.display='none';
  $id('app').style.display='grid';
  updateUI();
  loadRooms();
  renderChats();
}

function updateUI(){
  $id('myName').textContent=curUser.login;
  const ava=$id('myAva');
  if(curUser.avatar){ava.style.backgroundImage='url('+curUser.avatar+')';ava.textContent=''}
  else{ava.style.backgroundImage='';ava.textContent=curUser.login.charAt(0).toUpperCase()}
  $id('myStatus').textContent='Онлайн';
}

// ─── Rooms ───
function loadRooms(){
  rooms=JSON.parse(localStorage.getItem('yooma_rooms')||'[]');
  rooms=rooms.filter(r=>r.members&&r.members.includes(curUser.login));
  allMessages=JSON.parse(localStorage.getItem('yooma_messages')||'{}');
}

function saveRooms(){localStorage.setItem('yooma_rooms',JSON.stringify(rooms))}
function saveMessages(){localStorage.setItem('yooma_messages',JSON.stringify(allMessages))}

function renderChats(){
  const q=($id('chatSearch').value||'').toLowerCase();
  const list=$id('chatList');list.innerHTML='';
  rooms.filter(r=>r.name.toLowerCase().includes(q)).forEach(r=>{
    const active=currentRoom&&currentRoom.id===r.id;
    const msgs=allMessages[r.id]||[];
    const last=msgs.length?msgs[msgs.length-1]:null;
    const time=last?new Date(last.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    list.innerHTML+=`
      <div class="chat-item ${active?'active':''}" onclick="openRoom('${r.id}')">
        <div class="ava">${r.name.charAt(0).toUpperCase()}</div>
        <div class="info">
          <div class="name">${esc(r.name)}</div>
          <div class="last">${last?esc(last.text||(last.file?'📎 Файл':'')):'Нет сообщений'}</div>
        </div>
        <div class="time">${time}</div>
      </div>`;
  });
  if(!rooms.length)list.innerHTML='<div style="text-align:center;padding:30px;color:var(--muted);font-size:13px">Создайте первый чат</div>';
}

function createRoom(){
  const name=$id('roomName').value.trim();
  if(!name){$id('roomMsg').textContent='Введи название';return}
  const id=uid();
  const code=uid().slice(-6).toUpperCase();
  const room={id,name,code,members:[curUser.login],createdBy:curUser.login,createdAt:new Date().toISOString()};
  rooms.push(room);
  allMessages[id]=[];
  saveRooms();saveMessages();
  // Save user
  const users=JSON.parse(localStorage.getItem('yooma_users')||'[]');
  const u=users.find(x=>x.login===curUser.login);
  if(u){u.rooms=u.rooms||[];u.rooms.push(id)}
  localStorage.setItem('yooma_users',JSON.stringify(users));
  $id('roomMsg').textContent='Комната создана! Код: '+code+' (скажи друзьям)';
  closeModal('newChatModal');
  loadRooms();renderChats();
  openRoom(id);
}

function joinRoom(){
  const code=$id('roomCode').value.trim().toUpperCase();
  if(!code){$id('roomMsg').textContent='Введи код';return}
  const room=rooms.find(r=>r.code===code);
  if(!room){$id('roomMsg').textContent='Комната не найдена';return}
  if(!room.members.includes(curUser.login)){
    room.members.push(curUser.login);
    saveRooms();
  }
  closeModal('newChatModal');
  loadRooms();renderChats();
  openRoom(room.id);
}

function showNewChat(){
  $id('roomName').value='';$id('roomCode').value='';$id('roomMsg').textContent='';
  $id('newChatModal').classList.add('open');
}

// ─── Chat ───
function openRoom(id){
  const room=rooms.find(r=>r.id===id);
  if(!room)return;
  currentRoom=room;
  $id('chatHdr').style.display='flex';
  $id('inputArea').style.display='flex';
  $id('welcome').style.display='none';
  $id('chatAva').textContent=room.name.charAt(0).toUpperCase();
  $id('chatName').textContent=room.name;
  $id('chatStatus').textContent=room.members.length+' участников';
  renderMessages();
  renderChats();
}

function closeChat(){
  currentRoom=null;
  $id('chatHdr').style.display='none';
  $id('inputArea').style.display='none';
  $id('welcome').style.display='flex';
  $id('msgArea').innerHTML='';
}

function renderMessages(){
  const area=$id('msgArea');area.innerHTML='';
  const msgs=allMessages[currentRoom.id]||[];
  msgs.forEach(m=>addMessage(m,false));
  area.scrollTop=area.scrollHeight;
}

function addMessage(msg,prepend){
  const div=document.createElement('div');
  const isOwn=msg.sender===curUser.login;
  div.className='msg '+(isOwn?'own':'other');
  const time=new Date(msg.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  let html='';
  if(!isOwn)html+='<div class="sender">'+esc(msg.sender)+'</div>';
  if(msg.text)html+=esc(msg.text);
  if(msg.file){
    if(msg.file.match(/\.(png|jpg|jpeg|gif|webp|svg)$/i))html+='<br><img src="'+msg.file+'" alt="image">';
    else html+='<br><a class="file-link" href="'+msg.file+'" target="_blank">'+esc(msg.fileName||'Файл')+'</a>';
  }
  html+='<div class="time">'+time+'</div>';
  if(isOwn)html+='<button class="del" onclick="deleteMsg('+msg.id+')">✕</button>';
  div.innerHTML=html;
  if(prepend)area.prepend(div);
  else area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function sendMsg(){
  const text=$id('msgInput').value.trim();
  if(!text||!currentRoom)return;
  $id('msgInput').value='';
  const msg={id:Date.now(),sender:curUser.login,text,time:new Date().toISOString()};
  if(!allMessages[currentRoom.id])allMessages[currentRoom.id]=[];
  allMessages[currentRoom.id].push(msg);
  saveMessages();
  addMessage(msg,false);
  renderChats();
}

function deleteMsg(id){
  if(!currentRoom)return;
  const msgs=allMessages[currentRoom.id];
  const idx=msgs.findIndex(m=>m.id===id);
  if(idx<0)return;
  msgs.splice(idx,1);
  saveMessages();
  renderMessages();
}

function onTyping(){
  if(!currentRoom)return;
  $id('typingIndicator').textContent='Вы печатаете…';
  clearTimeout(typingTimers.typing);
  typingTimers.typing=setTimeout(()=>$id('typingIndicator').textContent='',2000);
}

// ─── Emoji ───
let emojiOpen=false;
function toggleEmoji(){
  emojiOpen=!emojiOpen;
  $id('emojiPicker').style.display=emojiOpen?'flex':'none';
  if(emojiOpen){
    const emojis=['😊','😂','❤️','🔥','👍','🎉','😎','🥰','😈','💀','🤔','👋','🙏','💪','✨','🌟','⭐','🎯','🎮','🚀','💯','👑','🎵','🎶','🌈','⚡','🔥','💥','🫡','🤝','🫶','💅','👀','🍀','🏆','📱','💻','🖥️','⌨️','🖱️','🎧','🎤','🎬','📸','🎁','🎂','🍕','🍔','🌮','🥤'];
    $id('emojiPicker').innerHTML=emojis.map(e=>'<button class="emoji-btn" onclick="insertEmoji(\''+e+'\')">'+e+'</button>').join('');
  }
}
function insertEmoji(e){
  $id('msgInput').value+=e;
  $id('msgInput').focus();
  emojiOpen=false;$id('emojiPicker').style.display='none';
}

// ─── Profile ───
function showProfile(){
  $id('profileName').value=curUser.login;
  $id('profileAvatar').value=curUser.avatar||'';
  $id('profileBio').value=curUser.bio||'';
  const pa=$id('profileAva');
  if(curUser.avatar){pa.style.backgroundImage='url('+curUser.avatar+')';pa.textContent=''}
  else{pa.style.backgroundImage='';pa.textContent=curUser.login.charAt(0).toUpperCase()}
  $id('profileModal').classList.add('open');
}

function saveProfile(){
  const login=$id('profileName').value.trim();
  const avatar=$id('profileAvatar').value.trim();
  const bio=$id('profileBio').value.trim();
  if(!login){notif('Ник не может быть пустым','err');return}
  const users=JSON.parse(localStorage.getItem('yooma_users')||'[]');
  const u=users.find(x=>x.login===curUser.login);
  if(u){u.login=login;u.avatar=avatar;u.bio=bio}
  localStorage.setItem('yooma_users',JSON.stringify(users));
  curUser.login=login;curUser.avatar=avatar;curUser.bio=bio;
  localStorage.setItem('yooma_user',JSON.stringify(curUser));
  updateUI();
  closeModal('profileModal');
  notif('Профиль сохранён');
}

function showChatInfo(){
  if(!currentRoom)return;
  const members=currentRoom.members.join(', ');
  alert('Комната: '+currentRoom.name+'\nКод: '+currentRoom.code+'\nУчастники: '+members+'\nСоздатель: '+currentRoom.createdBy);
}

// ─── Utils ───
function closeModal(id){$id(id).classList.remove('open')}
function notif(t,type){const d=document.createElement('div');d.style.cssText='position:fixed;top:16px;right:16px;z-index:3000;background:var(--bg2);border:1px solid var(--border2);border-left:3px solid '+(type==='err'?'var(--red)':'var(--green)')+';color:var(--body);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .25s ease;max-width:320px';d.textContent=t;document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},3000)}
$id('msgArea').addEventListener('click',()=>{emojiOpen=false;$id('emojiPicker').style.display='none'});

// Close modals on backdrop click
document.querySelectorAll('.modal-ov').forEach(m=>m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')}))

// ─── Init ───
const saved=localStorage.getItem('yooma_user');
if(saved){curUser=JSON.parse(saved);enterApp()}
</script>
